<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TABIB PRO - Algérie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    :root {
      --bg: #0f0f0f; --card: #1a1a1a; --accent: #4fc3f7; --text: #f0f0f0;
      --success: #2e7d32; --warning: #ff9800; --danger: #d32f2f; --whatsapp: #25D366;
    }

    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    input, textarea { -webkit-user-select: text; user-select: text; }

    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #notificationBar { height: 0; background: var(--accent); color: #000; text-align: center; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: height 0.4s ease; z-index: 2100; }
    #notificationBar.visible { height: 40px; }

    header { height: 60px; background: rgba(20, 20, 20, 0.98); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #333; z-index: 1000; }
    #navBrand { font-weight: 600; color: var(--accent); font-size: 1.1rem; letter-spacing: 4px; text-transform: uppercase; flex-grow: 1; text-align: center; margin-left: 10px; }
    
    .btn-auth { background: #222; color: white; border: 1px solid #444; padding: 8px 12px; border-radius: 15px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .btn-primary { background: var(--accent); color: #000; border: none; }
    
    .screen { display: none; overflow-y: auto; padding: 15px; flex-grow: 1; padding-bottom: 90px; }
    .active { display: block; }
    
    #patientNavbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #1a1a1a; border-top: 1px solid #333; display: none; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { color: #666; text-align: center; font-size: 1.2rem; cursor: pointer; flex: 1; position: relative; }
    .nav-item.active-nav { color: var(--accent); }
    .nav-item span { display: block; font-size: 0.6rem; margin-top: 2px; }

    .admin-sect { background: #1e1e1e; margin-bottom: 12px; border-radius: 12px; border: 1px solid #2a2a2a; overflow: hidden; }
    .admin-header { padding: 15px; background: #252525; cursor: pointer; display: flex; justify-content: space-between; font-weight: 600; font-size: 0.8rem; color: #888; align-items: center; position: relative; }
    .admin-content { padding: 18px; display: none; border-top: 1px solid #2a2a2a; }
    .open { display: block; }

    input, select { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: white; border-radius: 8px; font-size: 0.9rem; outline: none; box-sizing: border-box; }
    .btn-action { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: #000; margin-top: 5px; }
    .manage-item { display: flex; justify-content: space-between; background: #252525; padding: 12px; margin-bottom: 8px; border-radius: 8px; align-items: center; border: 1px solid #333; }
    
    .spec-card { background: var(--card); padding: 20px 10px; border-radius: 15px; text-align: center; border: 1px solid #2a2a2a; cursor: pointer; }
    .spec-card i { font-size: 2.2rem; color: var(--accent); margin-bottom: 12px; display: block; }

    .badge-count { background: var(--accent); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; min-width: 20px; text-align: center; }

    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; margin-top: 10px; table-layout: fixed; }
    th { background: #222; padding: 8px; color: #777; font-size: 0.55rem; }
    td { border: 1px solid #222; text-align: center; height: 50px; font-size: 0.7rem; font-weight: 600; cursor: pointer; }
    
    .available { background: var(--success); color: white; }
    .is-busy { background: var(--warning); color: #000; } 
    .is-full { background: #333; color: #666; }
    .is-blocked { background: #4a0000; color: #ff9999; }
    .past { background: #0a0a0a !important; color: #333 !important; pointer-events: none; }

    #loginDisplay { text-align: center; font-size: 2rem; margin: 10px 0; letter-spacing: 15px; height: 60px; background: #000; border-radius: 8px; line-height: 60px; border: 1px solid #333; color: var(--accent); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 280px; margin: 0 auto; }
    .num-btn { background: #1e1e1e; color: white; padding: 20px; border-radius: 50%; border: 1px solid #333; font-size: 1.4rem; cursor: pointer; }

    .internal-modal { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(20, 20, 20, 0.98); border-top: 3px solid var(--accent); padding: 20px; box-sizing: border-box; z-index: 2000; transform: translateY(100%); transition: 0.4s; }
    .modal-show { transform: translateY(0); }

    .btn-circle { width: 35px; height: 35px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }

    .dot-notif { height: 8px; width: 8px; background-color: #ff4444; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 5px #ff4444; }

    /* Impression */
    #printArea { display: none; }
    @media print {
        body > *:not(#printArea) { display: none !important; }
        #printArea { display: block !important; color: black !important; padding: 20px; }
        table { border: 1px solid black; }
        th, td { border: 1px solid black; color: black !important; background: white !important; }
    }
  </style>

    <div class="nav-item" onclick="showScreen('pagePatients')" id="navHome"><i class="fas fa-search"></i><span>Chercher</span></div>
    <div class="nav-item" onclick="logout()" style="color:var(--danger)"><i class="fas fa-sign-out-alt"></i><span>Quitter</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHDgrxnfQlvqN4ZfZH2J5qCjEQSoSbq4Y",
  authDomain: "tabib-380fb.firebaseapp.com",
  databaseURL: "https://tabib-380fb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tabib-380fb",
  storageBucket: "tabib-380fb.firebasestorage.app",
  messagingSenderId: "788379849606",
  appId: "1:788379849606:web:4cfd0f8d4184869e811207"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const dbRef = ref(db, 'tabibData');

let appData = { specs: [], patients: [], pendingPatients: [] };
let currCode = "", selectedDoc = null, activeDoc = null, activePatient = null, isHourMode = false;
let navigationHistory = ['pagePatients'];

window.showToast = (msg) => {
    const bar = document.getElementById('notificationBar');
    bar.textContent = msg; bar.classList.add('visible');
    setTimeout(() => { bar.classList.remove('visible'); }, 3000);
};

onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) { 
        appData = data; 
        if(activeDoc) {
            appData.specs.forEach(s => {
                const found = (s.docs || []).find(d => d.id === activeDoc.id);
                if(found) activeDoc = found;
            });
        }
        if(selectedDoc) {
             appData.specs.forEach(s => {
                const found = (s.docs || []).find(d => d.id === selectedDoc.id);
                if(found) selectedDoc = found;
            });
        }
        updateUI(); 
    }
});

function saveData() { update(ref(db), { tabibData: appData }); }

window.showScreen = (id, saveHistory = true) => {
    if(saveHistory && navigationHistory[navigationHistory.length - 1] !== id) navigationHistory.push(id);
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    
    const isHome = (id === 'pagePatients' && !activePatient);
    document.getElementById('authLeft').style.display = isHome ? 'block' : 'none';
    document.getElementById('authRight').style.display = isHome ? 'block' : 'none';
    document.getElementById('backBtnArea').style.display = (id !== 'pagePatients' && id !== 'pageLogin' && !activePatient) ? 'block' : 'none';
    document.getElementById('patientNavbar').style.display = activePatient ? 'flex' : 'none';
    
    updateUI();
};

window.goBack = () => { if(navigationHistory.length > 1) { navigationHistory.pop(); showScreen(navigationHistory[navigationHistory.length - 1], false); } };
window.logout = () => { location.reload(); };
window.openLogin = () => { currCode = ""; document.getElementById('loginDisplay').textContent = ""; showScreen('pageLogin'); };
window.pressN = (n) => { if(currCode.length < 4) { currCode += n; document.getElementById('loginDisplay').textContent = "•".repeat(currCode.length); } };
window.clearCode = () => { currCode = ""; document.getElementById('loginDisplay').textContent = ""; };

window.submitLogin = () => {
    if(currCode === "1747") { showScreen('pageAdmin'); return; }
    for(let s of appData.specs) { 
        if(s.docs) for(let d of s.docs) { 
            if(d.code === currCode) { 
                activeDoc = d; document.getElementById('docSpaceName').textContent = "Dr. " + d.name; showScreen('pageDocSpace'); return; 
            }
        }
    }
    const p = (appData.patients || []).find(x => String(x.code) === String(currCode));
    if(p) { activePatient = p; document.getElementById('patientWelcome').textContent = "Bonjour, " + p.name; showScreen('pagePatientSpace'); return; }
    showToast("Code invalide"); clearCode();
};

window.renderCalendar = (cid, isDoc) => {
    const targetDoc = isDoc ? activeDoc : selectedDoc;
    if(!targetDoc) return;
    const days = []; const lbls = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];
    for(let i=0; i<6; i++){ let d = new Date(); d.setDate(d.getDate()+i); days.push({l:lbls[d.getDay()], s:d.toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'})}); }
    const hours = [9, 10, 11, 14, 15, 16], now = new Date(), curH = now.getHours(), curD = now.toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'});
    let htm = `<table><tr><th></th>${days.map(d => `<th>${d.l}<br>${d.s}</th>`).join('')}</tr>`;
    hours.forEach(h => {
        htm += `<tr><td style="color:#666; font-size:0.6rem;">${h}h</td>`;
        days.forEach(d => {
            const key = `${d.s}-${h}`, allApps = (targetDoc.appointments || []);
            const validApps = allApps.filter(a => a.day === d.s && a.hour === h && a.status === 'valid');
            const pendingApps = allApps.filter(a => a.day === d.s && a.hour === h && a.status === 'pending');
            const blocked = (targetDoc.blockedSlots || []).includes(key);
            const mine = activePatient && allApps.find(a => a.patId === activePatient.id && a.day === d.s && a.hour === h);
            
            let cls = "available", txt = `${validApps.length}/${targetDoc.capacity}`;
            if(blocked){ cls = "is-blocked"; txt = "X"; }
            else if(mine){ cls = "is-busy"; txt = mine.status === 'valid' ? "Confirmé" : "Attente"; }
            else if(validApps.length >= targetDoc.capacity){ cls = "is-full"; txt = "Plein"; }
            else if(validApps.length > 0 || pendingApps.length > 0) { cls = "is-busy"; }
            
            if(d.s === curD && h <= curH) cls += " past";
            const canClick = isDoc || (!blocked && (validApps.length < targetDoc.capacity || mine));
            htm += `<td class="${cls}" onclick="${canClick ? `handleSlot('${d.s}',${h},${isDoc},${mine?true:false})` : ''}">${txt}</td>`;
        });
        htm += `</tr>`;
    });
    document.getElementById(cid).innerHTML = htm + `</table>`;
};

window.handleSlot = (day, hour, isDoc, isMine) => {
    if(isDoc) {
        const key = `${day}-${hour}`;
        if(isHourMode) {
            if(!activeDoc.blockedSlots) activeDoc.blockedSlots = [];
            if(activeDoc.blockedSlots.includes(key)) activeDoc.blockedSlots = activeDoc.blockedSlots.filter(s => s !== key);
            else activeDoc.blockedSlots.push(key);
            saveData(); return;
        }
        const list = (activeDoc.appointments || []).filter(a => a.day === day && a.hour === hour);
        if(list.length > 0) {
            document.getElementById('modalDocTitle').textContent = `RDV ${day} à ${hour}h`;
            document.getElementById('docActionInfo').innerHTML = list.map(a => `
                <div class="manage-item" style="flex-direction:column; align-items:stretch; gap:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>${a.patName}</b>
                        <span style="font-size:0.7rem; color:${a.status==='valid'?'var(--success)':'var(--warning)'}">${a.status==='valid'?'Validé':'En attente'}</span>
                    </div>
                    <div style="display:flex; gap:10px; justify-content: flex-end;">
                        <button class="btn-circle" style="background:var(--accent);" onclick="location.href='tel:${a.patTel}'"><i class="fas fa-phone"></i></button>
                        <button class="btn-circle" style="background:var(--danger);" onclick="confirmDeleteSlotRDV('${a.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`).join('');
            document.getElementById('modalConfirmButtons').style.display = 'none';
            document.getElementById('btnCloseModal').style.display = 'block';
            document.getElementById('modalDoc').classList.add('modal-show');
        }
    } else {
        if(!activePatient) { showToast("Veuillez vous connecter"); setTimeout(openLogin, 1000); return; }
        if(selectedDoc.expiresAt && Date.now() > selectedDoc.expiresAt) { showToast("Ce médecin n'accepte plus de rendez-vous (code obsolète)."); return; }
        const currentRDV = selectedDoc.appointments?.find(a => a.patId === activePatient.id && a.day === day && a.hour === hour);
        if (isMine && currentRDV && currentRDV.status === 'valid') {
            document.getElementById('modalDocTitle').textContent = "RDV Confirmé";
            document.getElementById('docActionInfo').innerHTML = `<p style="text-align:center; color:var(--success)">Ce rendez-vous est déjà confirmé par le médecin.<br>Vous ne pouvez plus l'annuler.</p>`;
            document.getElementById('modalConfirmButtons').style.display = 'none';
            document.getElementById('btnCloseModal').style.display = 'block';
        } else {
            document.getElementById('modalDocTitle').textContent = isMine ? "Annuler mon RDV ?" : "Réserver ce créneau ?";
            document.getElementById('docActionInfo').innerHTML = `<p style="text-align:center">${day} à ${hour}h</p>`;
            document.getElementById('modalConfirmButtons').style.display = 'flex';
            document.getElementById('btnFinalConfirm').onclick = () => { 
                if(isMine) {
                    selectedDoc.appointments = selectedDoc.appointments.filter(a => !(a.patId === activePatient.id && a.day === day && a.hour === hour));
                    saveData();
                    showToast("Rendez-vous annulé.");
                } else {
                    if(!selectedDoc.appointments) selectedDoc.appointments = [];
                    selectedDoc.appointments.push({ id:Date.now(), createdAt: Date.now(), patId:activePatient.id, patName:activePatient.name, patTel:activePatient.tel, day, hour, status: 'pending' });
                    saveData();
                    showToast("Demande envoyée.");
                }
                closeModals();
            };
        }
        document.getElementById('modalDoc').classList.add('modal-show');
    }
};

window.confirmDeleteSlotRDV = (id) => {
    document.getElementById('docActionInfo').innerHTML = `<p style="text-align:center">Voulez-vous vraiment supprimer ce rendez-vous ?</p>`;
    document.getElementById('modalConfirmButtons').style.display = 'flex';
    document.getElementById('btnFinalConfirm').onclick = () => {
        activeDoc.appointments = activeDoc.appointments.filter(a => a.id != id);
        saveData(); closeModals();
    };
};

window.renderDocAppointments = () => {
    const list = (activeDoc.appointments || []).filter(a => a.status === 'pending');
    list.sort((a, b) => a.createdAt - b.createdAt);
    document.getElementById('docAppointmentsList').innerHTML = list.map(a => {
        const d = new Date(a.createdAt);
        const timeStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours()}h${d.getMinutes().toString().padStart(2,'0')}`;
        return `
        <div class="manage-item" style="flex-direction: column; align-items: stretch; gap: 10px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div><b>${a.patName}</b><br><small style="color:#777;">Demandé le : ${timeStr}</small></div>
                <span style="font-size:0.75rem; color:var(--accent); text-align:right;">Slot: ${a.day}<br>${a.hour}h</span>
            </div>
            <div style="display:flex; gap:12px; justify-content: flex-end;">
                <button onclick="location.href='tel:${a.patTel}'" class="btn-circle" style="background:var(--accent);"><i class="fas fa-phone"></i></button>
                <button onclick="validateRDV('${a.id}')" class="btn-circle" style="background:var(--success);"><i class="fas fa-check"></i></button>
                <button onclick="rejectRDV('${a.id}')" class="btn-circle" style="background:var(--danger);"><i class="fas fa-times"></i></button>
            </div>
        </div>`;
    }).join('') || "Aucune demande en attente.";
};

window.validateRDV = (id) => {
    const app = activeDoc.appointments.find(a => a.id == id);
    if(app) { 
        app.status = 'valid'; 
        if(!activeDoc.history) activeDoc.history = [];
        activeDoc.history.push({...app, confirmedAt: Date.now()});
        saveData(); 
        showToast("RDV Validé"); 
    }
};

window.rejectRDV = (id) => {
    activeDoc.appointments = activeDoc.appointments.filter(a => a.id != id);
    saveData(); showToast("RDV Rejeté");
};

window.openHistory = () => {
    showScreen('pageHistory');
    const hList = activeDoc.history || [];
    document.getElementById('historyList').innerHTML = hList.map(h => `
        <div class="manage-item" style="flex-direction:column; align-items:start;">
            <div style="width:100%; display:flex; justify-content:space-between;"><b>${h.patName}</b> <small>${h.day} - ${h.hour}h</small></div>
            <div style="font-size:0.7rem; color:#888;">Tél: ${h.patTel}</div>
        </div>
    `).reverse().join('') || "<p style='text-align:center'>Aucun historique.</p>";
};

window.exportHistory = () => {
    if(!activeDoc.history || activeDoc.history.length === 0) return showToast("Historique vide");
    let txt = `HISTORIQUE DES RENDEZ-VOUS - Dr. ${activeDoc.name}\n\n`;
    activeDoc.history.forEach(h => {
        txt += `Patient: ${h.patName} | Tél: ${h.patTel} | Date: ${h.day} | Heure: ${h.hour}h\n`;
    });
    const blob = new Blob([txt], {type: "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `historique_dr_${activeDoc.name.replace(/ /g, '_')}.txt`;
    a.click();
};

window.clearHistory = () => {
    if(confirm("Voulez-vous vider tout l'historique ?")) {
        activeDoc.history = [];
        saveData();
        openHistory();
        showToast("Historique vidé");
    }
};

window.printDailyReport = () => {
    const today = new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'numeric'});
    const apps = (activeDoc.appointments || []).filter(a => a.day === today && a.status === 'valid');
    apps.sort((a,b) => a.hour - b.hour);

    let html = `
        <h1 style="text-align:center;">Rapport Journalier - Dr. ${activeDoc.name}</h1>
        <h3 style="text-align:center;">Date : ${today}</h3>
        <table style="width:100%; margin-top:30px;">
            <thead>
                <tr><th style="padding:10px;">Heure</th><th style="padding:10px;">Patient</th><th style="padding:10px;">Téléphone</th></tr>
            </thead>
            <tbody>
                ${apps.map(a => `<tr><td style="padding:10px; text-align:center;">${a.hour}h</td><td style="padding:10px;">${a.patName}</td><td style="padding:10px; text-align:center;">${a.patTel}</td></tr>`).join('')}
            </tbody>
        </table>
        ${apps.length === 0 ? '<p style="text-align:center; margin-top:20px;">Aucun rendez-vous aujourd\'hui.</p>' : ''}
    `;
    document.getElementById('printArea').innerHTML = html;
    window.print();
};

window.renderPatientAppointments = () => {
    let h = ""; (appData.specs || []).forEach(s => s.docs?.forEach(d => d.appointments?.filter(a => a.patId === activePatient.id).forEach(a => {
        const sTxt = a.status === 'valid' ? '<span style="color:var(--success)">Confirmé</span>' : '<span style="color:var(--warning)">En attente</span>';
        h += `<div class="manage-item"><div><b>Dr. ${d.name}</b><br><small>${a.day} à ${a.hour}h</small></div><div>${sTxt}</div></div>`;
    }))); document.getElementById('patientAppointments').innerHTML = h || "Aucun RDV.";
};

window.renderPendingPatients = () => {
    const list = appData.pendingPatients || [];
    document.getElementById('admPendingList').innerHTML = list.map(p => `
        <div class="manage-item" style="flex-direction: column; align-items: stretch; gap: 10px;">
            <div><b>${p.name}</b><br><small>${p.tel}</small></div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="location.href='tel:${p.tel}'" class="btn-circle" style="background:var(--accent);"><i class="fas fa-phone"></i></button>
                <button onclick="acceptPatient('${p.id}')" class="btn-circle" style="background:var(--success);"><i class="fas fa-check"></i></button>
                <button onclick="rejectPatient('${p.id}')" class="btn-circle" style="background:var(--danger);"><i class="fas fa-times"></i></button>
            </div>
        </div>`).join('') || "Aucune inscription en attente.";
};

window.renderUserList = () => {
    const list = appData.patients || [];
    document.getElementById('admUserList').innerHTML = list.map(p => `
        <div class="manage-item" style="flex-direction: column; align-items: stretch; padding: 12px; gap: 8px;">
            <div style="font-weight: 600; font-size: 0.95rem; color: var(--accent);">${p.name}</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 0.75rem; color: #bbb;">Tél: ${p.tel}<br>Code: <b>${p.code}</b></div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="location.href='tel:${p.tel}'" class="btn-circle" style="background: var(--success);"><i class="fas fa-phone"></i></button>
                    <button onclick="deleteUser('${p.id}')" class="btn-circle" style="background: var(--danger);"><i class="fas fa-times"></i></button>
                </div>
            </div>
        </div>`).join('');
};

window.deleteUser = (id) => { appData.patients = appData.patients.filter(p => p.id != id); saveData(); renderUserList(); };

window.renderAdminList = () => {
    let h = "";
    (appData.specs || []).forEach(s => {
        h += `<div class="admin-sect">
            <div class="admin-header" onclick="toggleSect(this)">
                <div style="display:flex; align-items:center; gap:10px;"><div class="badge-count">${(s.docs || []).length}</div><span>${s.label}</span></div>
                <button onclick="event.stopPropagation(); promptDeleteSpec('${s.id}')" class="btn-circle" style="background:none; color:var(--danger); border:none;"><i class="fas fa-trash"></i></button>
            </div>
            <div class="admin-content">
                <div id="confirm-spec-del-${s.id}" style="display:none; background:#330000; padding:10px; border-radius:8px; margin-bottom:10px; text-align:center;">
                    <p style="font-size:0.7rem; margin-bottom:10px;">Supprimer la spécialité et ses médecins ?</p>
                    <div style="display:flex; gap:10px;"><button class="btn-auth btn-primary" style="flex:1; background:var(--danger);" onclick="deleteSpec('${s.id}')">OUI</button><button class="btn-auth" style="flex:1;" onclick="cancelDeleteSpec('${s.id}')">NON</button></div>
                </div>
                ${(s.docs || []).map(d => `
                <div class="manage-item" style="flex-direction:column; align-items:stretch; gap:5px;" id="doc-card-${d.id}">
                    <div style="display:flex; justify-content:space-between;"><b>Dr. ${d.name}</b><span style="color:var(--accent)">${d.code}</span></div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <small>${d.tel} | Val: ${d.validityDays ? d.validityDays + 'j' : '0j'}</small>
                        <div style="display:flex; gap:5px;">
                            <button onclick="location.href='tel:${d.tel}'" class="btn-circle" style="background:var(--success);"><i class="fas fa-phone"></i></button>
                            <button onclick="openEditDoc('${s.id}','${d.id}')" class="btn-circle" style="background:var(--warning); color:black;"><i class="fas fa-edit"></i></button>
                            <button onclick="promptDeleteDoc('${s.id}','${d.id}')" class="btn-circle" style="background:var(--danger);"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <div id="confirm-del-${d.id}" style="display:none; background:#330000; padding:10px; border-radius:8px; margin-top:10px; text-align:center;">
                        <p style="font-size:0.7rem; margin-bottom:10px;">Supprimer définitivement ?</p>
                        <div style="display:flex; gap:10px;"><button class="btn-auth btn-primary" style="flex:1; background:var(--danger);" onclick="deleteDoc('${s.id}','${d.id}')">OUI</button><button class="btn-auth" style="flex:1;" onclick="cancelDelete('${d.id}')">NON</button></div>
                    </div>
                </div>`).join('')}
            </div>
        </div>`;
    });
    document.getElementById('admGlobalList').innerHTML = h;
};

window.promptDeleteSpec = (sid) => { document.getElementById(`confirm-spec-del-${sid}`).style.display = 'block'; };
window.cancelDeleteSpec = (sid) => { document.getElementById(`confirm-spec-del-${sid}`).style.display = 'none'; };
window.deleteSpec = (sid) => { appData.specs = appData.specs.filter(s => s.id !== sid); saveData(); renderAdminList(); };
window.promptDeleteDoc = (sid, did) => { document.getElementById(`confirm-del-${did}`).style.display = 'block'; };
window.cancelDelete = (did) => { document.getElementById(`confirm-del-${did}`).style.display = 'none'; };

window.openEditDoc = (sid, did) => {
    const s = appData.specs.find(x => x.id === sid), d = s.docs.find(x => x.id === did);
    document.getElementById('editDocName').value = d.name; document.getElementById('editDocTitle').value = d.title;
    document.getElementById('editDocTel').value = d.tel; document.getElementById('editDocCode').value = d.code;
    document.getElementById('editDocDuration').value = d.validityDays || "";
    document.getElementById('editCapDisplay').textContent = d.capacity;
    document.getElementById('btnUpdateDoc').onclick = () => {
        d.name = document.getElementById('editDocName').value; d.title = document.getElementById('editDocTitle').value;
        d.tel = document.getElementById('editDocTel').value; d.code = document.getElementById('editDocCode').value;
        const days = parseInt(document.getElementById('editDocDuration').value) || 0;
        d.validityDays = days;
        d.expiresAt = Date.now() + (days * 24 * 60 * 60 * 1000) - (days === 0 ? 60000 : 0);
        d.capacity = parseInt(document.getElementById('editCapDisplay').textContent);
        saveData(); closeModals(); renderAdminList();
    };
    document.getElementById('modalEditDoc').classList.add('modal-show');
};

window.deleteDoc = (sid, did) => {
    const s = appData.specs.find(x => x.id === sid);
    s.docs = s.docs.filter(x => x.id !== did); saveData(); renderAdminList();
};

window.renderPatientHome = () => {
    document.getElementById('specialtyGrid').innerHTML = (appData.specs || []).map(s => `<div class="spec-card" onclick="openSpec('${s.id}')"><i class="fas ${s.icon || 'fa-user-md'}"></i><b>${s.label}</b></div>`).join('');
};

window.openSpec = (sid) => {
    const s = appData.specs.find(x => x.id === sid);
    let h = `<button onclick="renderPatientHome()" style="grid-column:1/3; color:var(--accent); background:none; border:none; text-align:left; padding:10px; font-weight:bold;">← Retour</button>`;
    if(s.docs) h += s.docs.filter(d => !d.expiresAt || Date.now() <= d.expiresAt).map(d => `<div class="manage-item" onclick="openDocCal('${sid}','${d.id}')" style="grid-column:1/3;"><div><b>Dr. ${d.name}</b><br><small>${d.title}</small></div><i class="fas fa-calendar-alt" style="color:var(--accent)"></i></div>`).join('');
    document.getElementById('specialtyGrid').innerHTML = h;
};

window.openDocCal = (sid, did) => {
    selectedDoc = appData.specs.find(s => s.id === sid).docs.find(d => d.id === did);
    document.getElementById('calPatientInfo').innerHTML = `<b>Dr. ${selectedDoc.name}</b><br><small>${selectedDoc.title}</small>`;
    showScreen('pageCalPatient');
};

function updateUI() {
    const act = document.querySelector('.screen.active')?.id;
    if(act === 'pagePatients') renderPatientHome();
    if(activeDoc && act === 'pageDocSpace') { renderCalendar('docCalContainer', true); renderDocAppointments(); const pendingDoc = (activeDoc.appointments || []).filter(a => a.status === 'pending').length; document.getElementById('docNotifDot').style.display = pendingDoc > 0 ? 'inline-block' : 'none'; }
    if(selectedDoc && act === 'pageCalPatient') renderCalendar('calPatientContainer', false);
    if(activePatient && act === 'pagePatientSpace') renderPatientAppointments();
    if(act === 'pageAdmin') { if (appData.pendingPatients && appData.pendingPatients.length > 0) document.getElementById('notifDot').style.display = 'inline-block'; else document.getElementById('notifDot').style.display = 'none'; }
}

window.closeModals = () => document.querySelectorAll('.internal-modal').forEach(m => m.classList.remove('modal-show'));
window.toggleSect = (h) => h.nextElementSibling.classList.toggle('open');
window.cycleCap = (id) => { let el = document.getElementById(id); let v = parseInt(el.textContent); el.textContent = (v >= 4) ? 1 : v + 1; };

window.addSpec = () => {
    const name = document.getElementById('admSpecInput').value; if(!name) return;
    if(!appData.specs) appData.specs = []; 
    appData.specs.push({ id: 's'+Date.now(), label: name, icon: document.getElementById('admSpecIcon').value, docs: [] }); 
    saveData(); 
    document.getElementById('admSpecInput').value = "";
    showToast("Spécialité ajoutée !"); 
};

window.addDoc = () => {
    const sid = document.getElementById('admSpecSelect').value;
    const name = document.getElementById('admDocName').value;
    const title = document.getElementById('admDocTitle').value;
    const tel = document.getElementById('admDocTel').value;
    const code = document.getElementById('admDocCode').value;
    const durationInput = document.getElementById('admDocDuration').value;
    const cap = parseInt(document.getElementById('capDisplay').textContent);

    if(!sid || !name || !tel || !code || !durationInput) {
        showToast("Veuillez remplir tous les champs");
        return;
    }

    const days = parseInt(durationInput) || 0;
    const expiresAt = Date.now() + (days * 24 * 60 * 60 * 1000) - (days === 0 ? 60000 : 0);

    const spec = appData.specs.find(s => s.id === sid);
    if(spec) {
        if(!spec.docs) spec.docs = [];
        spec.docs.push({ 
            id: 'd'+Date.now(), name, title, tel, code, 
            capacity: cap, appointments: [], blockedSlots: [], history: [],
            validityDays: days, expiresAt: expiresAt
        });
        saveData();
        showToast("Médecin ajouté avec succès !");
        document.getElementById('admDocName').value = "";
        document.getElementById('admDocTitle').value = "";
        document.getElementById('admDocTel').value = "";
        document.getElementById('admDocCode').value = "";
        document.getElementById('admDocDuration').value = "";
    } else {
        showToast("Erreur : Spécialité introuvable");
    }
};

window.updateAdmSpecSelect = () => { document.getElementById('admSpecSelect').innerHTML = (appData.specs || []).map(s => `<option value="${s.id}">${s.label}</option>`).join(''); };
window.handleSignup = () => {
    const n = document.getElementById('regName').value, t = document.getElementById('regTel').value, c = document.getElementById('regPass').value;
    if(!n || !t || !c) return; if(!appData.pendingPatients) appData.pendingPatients = [];
    appData.pendingPatients.push({ id:Date.now(), name:n, tel:t, code:c }); saveData(); showToast("Demande envoyée !"); showScreen('pagePatients');
};
window.toggleHourMode = () => { isHourMode = !isHourMode; document.getElementById('btnToggleHours').style.background = isHourMode ? 'var(--danger)' : 'var(--accent)'; showToast(isHourMode ? "Mode Blocage activé" : "Mode Blocage désactivé"); };
window.acceptPatient = (id) => {
    const idx = appData.pendingPatients.findIndex(p => p.id == id);
    const p = appData.pendingPatients.splice(idx, 1)[0];
    if(!appData.patients) appData.patients = []; appData.patients.push(p); saveData(); renderPendingPatients(); showToast("Patient accepté");
};
window.rejectPatient = (id) => { appData.pendingPatients = appData.pendingPatients.filter(p => p.id != id); saveData(); renderPendingPatients(); showToast("Demande refusée"); };
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
</html>
