<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TABIB PRO - Algérie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS inchangé (version complète) ===== */
    :root {
      --bg: #ecfdf5; --card: #ffffff; --card-border: #d1fae5;
      --primary: #059669; --primary-light: #10b981; --primary-dark: #047857;
      --secondary: #3b82f6; --accent: #f59e0b; --text: #1f2937;
      --text-secondary: #4b5563; --text-muted: #6b7280;
      --success: #059669; --warning: #f59e0b; --danger: #dc2626;
      --radius: 1rem;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }
    * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; box-sizing: border-box; }
    input, textarea { -webkit-user-select: text; user-select: text; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; line-height: 1.5; }

    .text-center { text-align: center; } .text-primary { color: var(--primary); } .font-bold { font-weight: 700; }
    .flex { display: flex; } .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .mt-0 { margin-top: 0; } .mt-3 { margin-top: 12px; }
    .w-full { width: 100%; } .text-sm { font-size: 0.85rem; } .text-xs { font-size: 0.75rem; }

    #notificationBar { height: 0; background: var(--primary); color: white; font-weight: 600; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: height 0.4s ease; z-index: 2100; }
    #notificationBar.visible { height: 44px; }

    header { height: 64px; background: white; padding: 0 16px; border-bottom: 1px solid #e5e7eb; z-index: 1000; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    #navBrand { font-weight: 700; color: var(--primary); font-size: 1.2rem; letter-spacing: 2px; flex-grow: 1; margin-left: 10px; }

    .btn-auth, .btn-action, .btn-circle { cursor: pointer; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border:none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-auth { background: white; color: var(--text); border: 1px solid #d1d5db; padding: 6px 14px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; gap: 6px; }
    .btn-auth:hover { background: #f3f4f6; }
    .btn-primary { background: var(--primary); color: white!important; border-color: var(--primary); }
    .btn-action { width: 100%; padding: 12px; background: var(--primary); border-radius: 999px; font-weight: 700; font-size: 0.9rem; color: white; margin-top: 6px; }
    .btn-action:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn-circle { width: 38px; height: 38px; border-radius: 999px; color: white; font-size: 1rem; }
    .btn-circle:active, .btn-action:active { transform: scale(0.95); }

    .screen { display: none; overflow-y: auto; padding: 16px; flex-grow: 1; padding-bottom: 90px; background: var(--bg); }
    .screen.active { display: block; }

    #patientNavbar { position: fixed; bottom: 0; left: 0; width: 100%; height: 70px; background: white; border-top: 1px solid #e5e7eb; display: none; justify-content: space-around; align-items: center; z-index: 1000; }
    .nav-item { color: var(--text-muted); font-size: 1.3rem; cursor: pointer; flex: 1; padding: 6px 0; transition: color 0.2s; }
    .nav-item.active-nav { color: var(--primary); }
    .nav-item span { display: block; font-size: 0.6rem; margin-top: 2px; font-weight: 600; }

    .admin-sect { background: white; margin-bottom: 16px; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid #e5e7eb; overflow: hidden; }
    .admin-header { padding: 14px 18px; background: #f9fafb; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--text-secondary); border-bottom: 1px solid #e5e7eb; }
    .admin-content { padding: 16px 18px; display: none; border-top: 1px solid #f3f4f6; }
    .open { display: block; }

    input, select { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid #d1d5db; border-radius: 12px; font-size: 0.9rem; outline: none; transition: 0.2s; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15); }

    .manage-item { background: #f9fafb; padding: 14px 16px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #e5e7eb; }
    .spec-card { background: white; padding: 24px 12px; border-radius: var(--radius); border: 1px solid #e5e7eb; cursor: pointer; box-shadow: var(--shadow); transition: 0.2s; }
    .spec-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--primary-light); }
    .spec-card i { font-size: 2.4rem; color: var(--primary); margin-bottom: 12px; display: block; }

    .badge-count { background: var(--primary); color: white; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: 0.75rem; min-width: 24px; text-align: center; }
    .dot-notif { height: 10px; width: 10px; background-color: #ef4444; border-radius: 999px; display: inline-block; margin-right: 6px; box-shadow: 0 0 0 2px white; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius); overflow: hidden; margin-top: 12px; box-shadow: var(--shadow); }
    th { background: #f3f4f6; padding: 10px 4px; color: var(--text-secondary); font-size: 0.6rem; font-weight: 600; text-transform: uppercase; }
    td { border: 1px solid #e5e7eb; text-align: center; height: 48px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .available { background: #ecfdf5; color: var(--primary); }
    .is-busy { background: #fef3c7; color: #92400e; }
    .is-full { background: #e5e7eb; color: #6b7280; cursor: default; }
    .is-blocked { background: #fee2e2; color: #991b1b; }
    .past { background: #f3f4f6!important; color: #9ca3af!important; cursor: default!important; opacity: 0.6; }

    #loginDisplay { font-size: 2.2rem; margin: 12px 0 18px; letter-spacing: 12px; height: 64px; background: white; border-radius: 12px; line-height: 64px; border: 1px solid #d1d5db; color: var(--primary); box-shadow: var(--shadow); }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 280px; margin: 0 auto; }
    .num-btn { background: white; padding: 18px; border-radius: 999px; border: 1px solid #d1d5db; font-size: 1.5rem; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }

    .internal-modal { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 24px 24px 0 0; box-shadow: 0 -10px 25px rgba(0,0,0,0.15); padding: 24px 20px 30px; z-index: 2000; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
    .modal-show { transform: translateY(0); }

    #printArea { display: none; }
    @media print { body > *:not(#printArea) { display: none!important; } #printArea { display: block!important; color: black; padding: 20px; } table, th, td { border: 1px solid black; background: white!important; } }

    .bg-danger { background: var(--danger); } .bg-success { background: var(--success); } .bg-warning { background: var(--warning); color: black; } .bg-accent { background: var(--secondary); } .bg-gray { background: #6b7280; color: white; }
    small, .text-muted { color: var(--text-muted); }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
</head>
<body oncontextmenu="return false;"> 
<div id="notificationBar" class="text-xs">Message</div>

<header class="flex-between">
    <div id="authLeft"><button class="btn-auth btn-primary" onclick="App.showScreen('pageSignup')">Inscription</button></div>
    <div id="backBtnArea" style="display:none;"><i class="fas fa-arrow-left" onclick="App.goBack()" style="cursor:pointer; font-size:1.2rem;"></i></div>
    <div id="navBrand" class="text-center">TABIB</div>
    <div id="authRight"><button class="btn-auth" onclick="App.openLogin()">Connexion</button></div>
</header>

<div id="printArea"></div>

<div id="pagePatients" class="screen active">
    <div id="specialtyGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;"></div>
</div>

<div id="pageLogin" class="screen text-center">
    <div class="flex" style="margin-bottom:20px;"><button onclick="App.goBack()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:600;"><i class="fas fa-arrow-left"></i> Retour</button></div>

<div id="pageDocSpace" class="screen">
    <h2 id="docSpaceName" class="text-center text-primary font-bold mt-0 mb-3"></h2>
    <div class="admin-sect">
        <div class="admin-header flex-between" onclick="App.renderDocApps(); App.toggleSect(this)">
            <span><span id="docNotifDot" style="display:none;" class="dot-notif"></span>DEMANDES DE RDV</span> <i class="fas fa-bell text-primary"></i>
        </div>
        <div class="admin-content" id="docAppointmentsList"></div>
    </div>
    <div id="docCalContainer"></div>
    <div class="flex gap-2 mt-3">
        <button id="btnToggleHours" class="btn-action bg-accent" onclick="App.toggleHourMode()"><i class="fas fa-lock"></i> BLOQUER</button>
        <button class="btn-action bg-gray" onclick="App.printDailyReport()"><i class="fas fa-print"></i> LISTE</button>
        <button class="btn-action bg-gray" onclick="App.openHistory()"><i class="fas fa-history"></i> HISTO</button>

<div id="pageHistory" class="screen">
    <h2 class="text-center text-primary font-bold">Historique Confirmé</h2>
    <div class="flex justify-center gap-3 mb-3">
        <button class="btn-circle bg-primary" onclick="App.exportHistory()"><i class="fas fa-file-export"></i></button>
        <button class="btn-circle bg-danger" onclick="App.clearHistory()"><i class="fas fa-trash-sweep"></i></button>

</div>

            <div id="adminsList"></div>

                <input type="text" id="newAdminName" placeholder="Nom de l'admin" style="flex:2;">
                <input type="password" id="newAdminCode" placeholder="Code (4 chiffres)" style="flex:1;" maxlength="4">
                <button class="btn-action" onclick="App.addAdmin()" style="flex:0 0 auto;">AJOUTER</button>

    </div>
    <!-- FIN SECTION ADMINS -->
    <div class="admin-sect">
        <div class="admin-header flex-between" onclick="App.renderPending(); App.toggleSect(this)">
            <span><span id="notifDot" style="display:none;" class="dot-notif"></span>INSCRIPTIONS EN ATTENTE</span> <i class="fas fa-user-plus text-primary"></i>
        </div>
        <div class="admin-content" id="admPendingList"></div>
    </div>
    <div class="admin-sect">
        <div class="admin-header flex-between" onclick="App.renderUsers(); App.toggleSect(this)">LISTE UTILISATEURS <i class="fas fa-users text-primary"></i></div>

    <div class="admin-sect">
        <div class="admin-header flex-between" onclick="App.toggleSect(this)">AJOUTER SPÉCIALITÉ <i class="fas fa-plus text-primary"></i></div>
        <div class="admin-content"><input type="text" id="admSpecInput" placeholder="Nom spécialité"><button class="btn-action" onclick="App.addSpec()">CRÉER</button></div>

    <div class="admin-sect">
        <div class="admin-header flex-between" onclick="App.updateSpecSel(); App.toggleSect(this)">AJOUTER MÉDECIN <i class="fas fa-user-md text-primary"></i></div>
        <div class="admin-content">
            <select id="admSpecSelect"></select><input type="text" id="admDocName" placeholder="Nom Dr."><input type="text" id="admDocTitle" placeholder="Titre / Grade">

        <div class="admin-header flex-between" onclick="App.renderAdmins(); App.toggleSect(this)">GÉRER MÉDECINS <i class="fas fa-trash-alt text-danger"></i></div>

    <input type="text" id="editDocName"><input type="text" id="editDocTitle"><input type="tel" id="editDocTel"><input type="text" id="editDocCode">

        <span id="editCapDisplay" class="font-bold text-primary" style="font-size:1.4rem;">3</span><button class="btn-auth" onclick="App.cycleCap('editCapDisplay')">Capacité</button>

    <button class="btn-action" id="btnUpdateDoc">METTRE À JOUR</button>
    <button class="btn-action bg-gray" onclick="App.closeModals()">ANNULER</button>
</div>

<div id="pagePatientSpace" class="screen">
    <h2 id="patientWelcome" class="text-center text-primary font-bold"></h2>
    <div id="patientAppointments"></div>
</div>

<div id="pageCalPatient" class="screen">
    <div id="calPatientInfo" class="text-center mb-3 p-3 bg-white border-radius-lg shadow border"></div>
    <div id="calPatientContainer"></div>
</div>

<div id="pageSignup" class="screen">
    <h2 class="text-center font-bold">Inscription</h2>
    <input type="text" id="regName" placeholder="Nom complet"><input type="tel" id="regTel" placeholder="Téléphone"><input type="password" id="regPass" placeholder="Code (4 chiffres)">
    <button class="btn-action" onclick="App.handleSignup()">S'INSCRIRE</button>
</div>

    <h3 id="modalDocTitle" class="mt-0 font-bold">Détails</h3>
    <div id="docActionInfo"></div>
    <div id="modalConfirmButtons" style="display:none; gap:10px; margin-top:20px;">
        <button id="btnFinalConfirm" class="btn-action mt-0 flex-1">OUI</button>
        <button class="btn-action bg-gray mt-0 flex-1" onclick="App.closeModals()">NON</button>
    </div>
    <button id="btnCloseModal" class="btn-action bg-gray mt-3" onclick="App.closeModals()">FERMER</button>
</div>

<div id="patientNavbar">
    <div class="nav-item text-center" onclick="App.showScreen('pagePatientSpace')"><i class="fas fa-calendar-check"></i><span>Mes RDV</span></div>
    <div class="nav-item text-center" onclick="App.showScreen('pagePatients')"><i class="fas fa-search"></i><span>Chercher</span></div>
    <div class="nav-item text-center text-danger" onclick="App.logout()"><i class="fas fa-sign-out-alt"></i><span>Quitter</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ===== Firebase =====
const firebaseConfig = {
  apiKey: "AIzaSyAHDgrxnfQlvqN4ZfZH2J5qCjEQSoSbq4Y",
  authDomain: "tabib-380fb.firebaseapp.com",
  databaseURL: "https://tabib-380fb-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tabib-380fb",
  storageBucket: "tabib-380fb.firebasestorage.app",
  messagingSenderId: "788379849606",
  appId: "1:788379849606:web:4cfd0f8d4184869e811207"
};
const db = getDatabase(initializeApp(firebaseConfig));
const dbRef = ref(db, 'tabibData');

// ===== Helpers =====
const $ = id => document.getElementById(id);
const $$ = sel => document.querySelectorAll(sel);

// ===== Hachage SHA-256 =====
async function hashCode(code) {
  const enc = new TextEncoder().encode(code);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ===== Objet App =====
const App = {
  appData: { specs: [], patients: [], pendingPatients: [], admins: [], adminHash: null, _version: 0 },
  currCode: "", selectedDoc: null, activeDoc: null, activePatient: null, isHourMode: false, navigationHistory: ['pagePatients'],

  async init() {
    try { const s = localStorage.getItem('tabibData'); if (s) this.appData = JSON.parse(s) || this.appData; } catch (e){}

    onValue(dbRef, async (snap) => {
      if (snap.val()) {
        this.appData = snap.val();
        if (!this.appData.adminHash) {
          console.log("🔑 Génération du hash admin par défaut...");
          await this.generateAdminHash();
        }
      } else {
        this.appData = { specs: [], patients: [], pendingPatients: [], admins: [], adminHash: null, _version: 0 };
        console.log("🔑 Initialisation Firebase – génération du hash admin...");
        await this.generateAdminHash();
      }
      this.persistLocally();
      if (this.activeDoc) this.activeDoc = this.appData.specs.flatMap(s=>s.docs||[]).find(d=>d.id===this.activeDoc.id);
      if (this.selectedDoc) this.selectedDoc = this.appData.specs.flatMap(s=>s.docs||[]).find(d=>d.id===this.selectedDoc.id);
      this.updateUI();
    });

    $('btnUpdateDoc').addEventListener('click', () => this.updateDoc());

    const numpadContainer = $('numpadContainer');
    if (numpadContainer) {
      numpadContainer.innerHTML = `
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num-btn" onclick="App.pressN('${n}')">${n}</button>`).join('')}
        <button class="num-btn text-danger" onclick="App.clearCode()">C</button>
        <button class="num-btn" onclick="App.pressN('0')">0</button>
        <button class="num-btn text-success" onclick="App.submitLogin()"><i class="fas fa-check"></i></button>
      `;
    }

    this.updateUI();
  },

  async generateAdminHash() {
    const hash = await hashCode('00001747');
    this.appData.adminHash = hash;
    await this.saveData();
    console.log("✅ Hash admin enregistré :", hash);
  },

  persistLocally() { try{ localStorage.setItem('tabibData', JSON.stringify(this.appData)); }catch(e){} },

  async saveData() {
    this.appData._version = (this.appData._version || 0) + 1;
    await update(dbRef, this.appData);
    this.persistLocally();
  },

  showToast(msg) {
    $('notificationBar').textContent = msg; $('notificationBar').classList.add('visible');
    setTimeout(() => $('notificationBar').classList.remove('visible'), 3000);
  },

  showScreen(id, saveHist = true) {
    if (saveHist && this.navigationHistory.at(-1) !== id) this.navigationHistory.push(id);
    $$('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    const isHome = (id === 'pagePatients' && !this.activePatient);
    $('authLeft').style.display = $('authRight').style.display = isHome ? 'block' : 'none';
    $('backBtnArea').style.display = (!isHome && id !== 'pageLogin') ? 'block' : 'none';
    $('patientNavbar').style.display = this.activePatient ? 'flex' : 'none';
    this.updateUI();
  },

  goBack() { if(this.navigationHistory.length > 1){ this.navigationHistory.pop(); this.showScreen(this.navigationHistory.at(-1), false); } },
  logout() { location.reload(); },

  openLogin() { this.currCode = ""; $('loginDisplay').textContent = ""; this.showScreen('pageLogin'); },

  pressN(n) {
    if (this.currCode.length < 8) {
      this.currCode += n;
      $('loginDisplay').textContent = "•".repeat(this.currCode.length);
    }
  },
  clearCode() { this.currCode = ""; $('loginDisplay').textContent = ""; },

  async submitLogin() {
    const code = this.currCode;
    if (!code) return this.showToast("Entrez un code");

    if (this.appData.adminHash) {
      const hashed = await hashCode(code);
      if (hashed === this.appData.adminHash) {
        this.showScreen('pageAdmin');
        this.clearCode();
        return;
      }
      if (this.appData.admins) {
        for (let admin of this.appData.admins) {
          if (await hashCode(code) === admin.hash) {
            this.showScreen('pageAdmin');
            this.clearCode();
            return;
          }
        }
      }
    }

    const d = this.appData.specs.flatMap(s=>s.docs||[]).find(x=>x.code === code);
    if(d) { this.activeDoc = d; $('docSpaceName').textContent = "Dr. " + d.name; this.showScreen('pageDocSpace'); this.clearCode(); return; }

    const p = (this.appData.patients||[]).find(x=>x.code === code);
    if(p) { this.activePatient = p; $('patientWelcome').textContent = "Bonjour, " + p.name; this.showScreen('pagePatientSpace'); this.clearCode(); return; }

    this.showToast("Code invalide"); this.clearCode();
  },

  // === Gestion des admins ===
  renderAdminsList() {
    const container = $('adminsList');
    if (!container) return;
    const admins = this.appData.admins || [];
    container.innerHTML = admins.map(a => `
      <div class="manage-item flex-between">
        <div><b>${a.name}</b><br><small>Hash: ${a.hash.slice(0,8)}…</small></div>
        <button onclick="App.removeAdmin('${a.id}')" class="btn-circle bg-danger"><i class="fas fa-trash"></i></button>
      </div>
    `).join('') || "<p class='text-muted'>Aucun admin.</p>";
  },

  async addAdmin() {
    const name = $('newAdminName').value.trim();
    const code = $('newAdminCode').value.trim();
    if (!name || !code || code.length !== 4) return this.showToast("Nom et code (4 chiffres) requis");
    const hash = await hashCode(code);
    if (!this.appData.admins) this.appData.admins = [];
    this.appData.admins.push({ id: 'a'+Date.now(), name, hash, createdAt: Date.now() });
    await this.saveData();
    this.renderAdminsList();
    $('newAdminName').value = '';
    $('newAdminCode').value = '';
    this.showToast("Admin ajouté !");
  },

  removeAdmin(id) {
    if (!confirm("Supprimer cet admin ?")) return;
    this.appData.admins = this.appData.admins.filter(a => a.id !== id);
    this.saveData();
    this.renderAdminsList();
    this.showToast("Admin supprimé.");
  },

  // ===== RENDER ADMINS (AMÉLIORÉ) =====
  renderAdmins() {
    $('admGlobalList').innerHTML = (this.appData.specs||[]).map(s => {
      const count = (s.docs||[]).length;
      return `<div class="admin-sect">
        <div class="admin-header flex-between" onclick="App.toggleSect(this)">
          <div>
            <span style="background: var(--primary); color: white; border-radius: 999px; padding: 2px 14px; font-weight: bold; font-size: 0.9rem; display: inline-block; margin-right: 10px;">${count}</span>
            <span style="font-weight: 600;">${s.label}</span>
            ${count > 0 ? `<span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 8px;">${count} médecin${count>1?'s':''}</span>` : ''}
          </div>
          <button onclick="event.stopPropagation(); if(confirm('Supprimer la spécialité \\"${s.label}\\" ?')) App.delSpec('${s.id}')" 
                  style="background: #fee2e2; border: none; color: var(--danger); width: 34px; height: 34px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem;">
            <i class="fas fa-trash"></i>
          </button>
        </div>
        <div class="admin-content">
          ${(s.docs||[]).map(d => `
            <div class="manage-item flex-between">
              <div><b>Dr. ${d.name}</b><br><small>${d.code} | ${d.validityDays||0}j</small></div>
              <div class="flex gap-2">
                <button onclick="App.openEditDoc('${s.id}','${d.id}')" class="btn-circle bg-accent"><i class="fas fa-edit"></i></button>
                <button onclick="App.delDoc('${s.id}','${d.id}')" class="btn-circle bg-danger"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`;
    }).join('');
  },

  // ===== Le reste du code est inchangé =====
  renderCalendar(cid, isDoc) {
    const doc = isDoc ? this.activeDoc : this.selectedDoc; if (!doc) return;
    const days = Array.from({length:6}, (_,i) => { let d=new Date(); d.setDate(d.getDate()+i); return { l:["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"][d.getDay()], s:d.toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'}) };});
    const now = new Date(), curH = now.getHours(), curD = now.toLocaleDateString('fr-FR');
    
    let htm = `<table><tr><th></th>${days.map(d=>`<th>${d.l}<br>${d.s}</th>`).join('')}</tr>`;
    [9,10,11,14,15,16].forEach(h => {
      htm += `<tr><td style="color:var(--text-muted); font-size:0.6rem;">${h}h</td>`;
      days.forEach(d => {
        const key = `${d.s}-${h}`, all = doc.appointments||[], val = all.filter(a=>a.day===d.s&&a.hour===h&&a.status==='valid');
        const blk = (doc.blockedSlots||[]).includes(key), mine = this.activePatient && all.find(a=>a.patId===this.activePatient.id&&a.day===d.s&&a.hour===h);
        let cls = blk ? "is-blocked" : mine ? "is-busy" : val.length >= doc.capacity ? "is-full" : val.length||all.filter(a=>a.day===d.s&&a.hour===h&&a.status==='pending').length ? "is-busy" : "available";
        let txt = blk ? "X" : mine ? (mine.status==='valid'?"Confirmé":"Attente") : val.length>=doc.capacity ? "Plein" : `${val.length}/${doc.capacity}`;
        if(d.s===curD && h<=curH) cls += " past";
        const clickable = isDoc ? true : (!blk && (val.length < doc.capacity || mine));
        htm += `<td class="${cls}" ${clickable ? `onclick="App.handleSlot('${d.s}',${h},${isDoc},${!!mine})"` : ''}>${txt}</td>`;
      });
      htm += `</tr>`;
    });
    $(cid).innerHTML = htm + `</table>`;
  },

  handleSlot(day, hour, isDoc, isMine) {
    if (isDoc) {
      if (this.isHourMode) {
        let blk = this.activeDoc.blockedSlots||[];
        this.activeDoc.blockedSlots = blk.includes(`${day}-${hour}`) ? blk.filter(s=>s!==`${day}-${hour}`) : [...blk, `${day}-${hour}`];
        this.saveData(); this.renderCalendar('docCalContainer', true);
        return;
      }
      const ls = (this.activeDoc.appointments||[]).filter(a=>a.day===day&&a.hour===hour);
      if(ls.length) {
        $('modalDocTitle').textContent = `RDV ${day} à ${hour}h`;
        $('docActionInfo').innerHTML = ls.map(a=>`<div class="manage-item flex-between"><div><b>${a.patName}</b><br><small class="${a.status==='valid'?'text-success':'text-warning'}">${a.status==='valid'?'Validé':'Attente'}</small></div><div class="flex gap-2"><button class="btn-circle bg-accent" onclick="location.href='tel:${a.patTel}'"><i class="fas fa-phone"></i></button><button class="btn-circle bg-success" onclick="App.validateRDV('${a.id}')"><i class="fas fa-check"></i></button><button class="btn-circle bg-danger" onclick="App.confirmDelRDV('${a.id}')"><i class="fas fa-trash"></i></button></div></div>`).join('');
        $('modalConfirmButtons').style.display='none'; $('btnCloseModal').style.display='block';
        $('modalDoc').classList.add('modal-show');
      }
    } else {
      if(!this.activePatient) { this.showToast("Connectez-vous"); return setTimeout(()=>this.openLogin(),1000); }
      if(this.selectedDoc.expiresAt && Date.now()>this.selectedDoc.expiresAt) return this.showToast("Code obsolète.");
      const rdv = this.selectedDoc.appointments?.find(a=>a.patId===this.activePatient.id&&a.day===day&&a.hour===hour);
      if(isMine && rdv?.status==='valid') {
        $('modalDocTitle').textContent="RDV Confirmé"; $('docActionInfo').innerHTML=`<p class="text-center text-success">Déjà confirmé par le médecin.</p>`;
        $('modalConfirmButtons').style.display='none'; $('btnCloseModal').style.display='block';
      } else {
        $('modalDocTitle').textContent=isMine?"Annuler ?":"Réserver ?"; $('docActionInfo').innerHTML=`<p class="text-center">${day} à ${hour}h</p>`;
        $('modalConfirmButtons').style.display='flex';
        $('btnFinalConfirm').onclick = () => {
          if(isMine) { this.selectedDoc.appointments = this.selectedDoc.appointments.filter(a=>!(a.patId===this.activePatient.id&&a.day===day&&a.hour===hour)); this.showToast("Annulé."); }
          else { this.selectedDoc.appointments = [...(this.selectedDoc.appointments||[]), {id:Date.now(), createdAt:Date.now(), patId:this.activePatient.id, patName:this.activePatient.name, patTel:this.activePatient.tel, day, hour, status:'pending'}]; this.showToast("Demande envoyée."); }
          this.saveData(); this.closeModals();
        };
      }
      $('modalDoc').classList.add('modal-show');
    }
  },

  confirmDelRDV(id) {
    $('docActionInfo').innerHTML=`<p class="text-center">Supprimer ce rendez-vous ?</p>`; $('modalConfirmButtons').style.display='flex';
    $('btnFinalConfirm').onclick=()=>{ this.activeDoc.appointments=this.activeDoc.appointments.filter(a=>a.id!=id); this.saveData(); this.closeModals(); this.updateUI(); this.showToast("Supprimé."); };
  },

  renderDocApps() {
    $('docAppointmentsList').innerHTML = (this.activeDoc.appointments||[]).filter(a=>a.status==='pending').sort((a,b)=>a.createdAt-b.createdAt).map(a=>`<div class="manage-item flex-between"><div><b>${a.patName}</b><br><small>Date: ${new Date(a.createdAt).toLocaleString()}</small></div><div class="flex gap-2"><button onclick="App.validateRDV('${a.id}')" class="btn-circle bg-success"><i class="fas fa-check"></i></button><button onclick="App.rejectRDV('${a.id}')" class="btn-circle bg-danger"><i class="fas fa-times"></i></button></div></div>`).join('') || "Aucune demande.";
  },

  validateRDV(id) { const a = this.activeDoc.appointments.find(x=>x.id==id); if(a){ a.status='valid'; this.activeDoc.history=[...(this.activeDoc.history||[]), {...a, confirmedAt:Date.now()}]; this.saveData(); this.updateUI(); this.showToast("Validé"); } },
  rejectRDV(id) { this.activeDoc.appointments = this.activeDoc.appointments.filter(a=>a.id!=id); this.saveData(); this.updateUI(); this.showToast("Rejeté"); },

  openHistory() { this.showScreen('pageHistory'); $('historyList').innerHTML = (this.activeDoc.history||[]).map(h=>`<div class="manage-item"><b>${h.patName}</b> <small>${h.day} - ${h.hour}h</small></div>`).reverse().join('') || "<p class='text-center text-muted'>Vide.</p>"; },
  exportHistory() { if(!this.activeDoc.history?.length) return this.showToast("Vide"); const a = document.createElement("a"); a.href=URL.createObjectURL(new Blob([this.activeDoc.history.map(h=>`${h.patName} | ${h.patTel} | ${h.day} à ${h.hour}h`).join('\n')],{type:"text/plain"})); a.download="historique.txt"; a.click(); },
  clearHistory() { if(confirm("Vider l'historique ?")) { this.activeDoc.history=[]; this.saveData(); this.openHistory(); this.showToast("Vidé"); } },

  printDailyReport() {
    const today = new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'numeric'});
    const apps = (this.activeDoc.appointments||[]).filter(a=>a.day===today&&a.status==='valid').sort((a,b)=>a.hour-b.hour);
    $('printArea').innerHTML = `<h1 class="text-center">Rapport - Dr. ${this.activeDoc.name}</h1><h3 class="text-center">${today}</h3><table><tr><th>Heure</th><th>Patient</th><th>Tel</th></tr>${apps.map(a=>`<tr><td>${a.hour}h</td><td>${a.patName}</td><td>${a.patTel}</td></tr>`).join('')}</table>`; window.print();
  },

  renderPatientApps() {
    let h=""; (this.appData.specs||[]).forEach(s=>s.docs?.forEach(d=>d.appointments?.filter(a=>a.patId===this.activePatient.id).forEach(a=>h+=`<div class="manage-item flex-between"><div><b>Dr. ${d.name}</b><br><small>${a.day} à ${a.hour}h</small></div><span class="${a.status==='valid'?'text-success':'text-warning'}">${a.status==='valid'?'Confirmé':'Attente'}</span></div>`)));
    $('patientAppointments').innerHTML = h || "Aucun RDV.";
  },

  renderPending() { $('admPendingList').innerHTML = (this.appData.pendingPatients||[]).map(p=>`<div class="manage-item flex-between"><div><b>${p.name}</b><br><small>${p.tel}</small></div><div class="flex gap-2"><button onclick="App.acceptPat('${p.id}')" class="btn-circle bg-success"><i class="fas fa-check"></i></button><button onclick="App.rejectPat('${p.id}')" class="btn-circle bg-danger"><i class="fas fa-times"></i></button></div></div>`).join('') || "Aucun."; },
  acceptPat(id) { const p = this.appData.pendingPatients.find(x=>x.id==id); this.appData.pendingPatients=this.appData.pendingPatients.filter(x=>x.id!=id); this.appData.patients=[...(this.appData.patients||[]), p]; this.saveData(); this.renderPending(); },
  rejectPat(id) { this.appData.pendingPatients = this.appData.pendingPatients.filter(p=>p.id!=id); this.saveData(); this.renderPending(); },

  renderUsers() { $('admUserList').innerHTML = (this.appData.patients||[]).map(p=>`<div class="manage-item flex-between"><div><b>${p.name}</b><br><small>Code: ${p.code}</small></div><button onclick="App.delUser('${p.id}')" class="btn-circle bg-danger"><i class="fas fa-times"></i></button></div>`).join(''); },
  delUser(id) { this.appData.patients = this.appData.patients.filter(p=>p.id!=id); this.saveData(); this.renderUsers(); },

  // La fonction renderAdmins() est maintenant définie plus haut (améliorée)

  delSpec(id) { if(confirm("Supprimer la spécialité ?")) { this.appData.specs=this.appData.specs.filter(s=>s.id!==id); this.saveData(); this.renderAdmins(); } },
  delDoc(sid,did) { if(confirm("Supprimer ce médecin ?")) { const s=this.appData.specs.find(x=>x.id===sid); s.docs=s.docs.filter(x=>x.id!==did); this.saveData(); this.renderAdmins(); } },

  openEditDoc(sid, did) {
    const d = this.appData.specs.find(x=>x.id===sid).docs.find(x=>x.id===did);
    ['Name','Title','Tel','Code'].forEach(k=>$('editDoc'+k).value=d[k.toLowerCase()]);
    $('editDocDuration').value = d.validityDays||""; $('editCapDisplay').textContent=d.capacity;
    this._eS=sid; this._eD=did; $('modalEditDoc').classList.add('modal-show');
  },
  updateDoc() {
    const d = this.appData.specs.find(x=>x.id===this._eS).docs.find(x=>x.id===this._eD), j = parseInt($('editDocDuration').value)||0;
    ['Name','Title','Tel','Code'].forEach(k=>d[k.toLowerCase()]=$('editDoc'+k).value);
    d.validityDays = j; d.expiresAt = Date.now()+(j*86400000)-(j?0:60000); d.capacity = parseInt($('editCapDisplay').textContent);
    this.saveData(); this.closeModals(); this.renderAdmins();
  },

  renderPatientHome() { $('specialtyGrid').innerHTML = (this.appData.specs||[]).map(s=>`<div class="spec-card" onclick="App.openSpec('${s.id}')"><i class="fas ${s.icon||'fa-user-md'}"></i><b>${s.label}</b></div>`).join(''); },
  openSpec(sid) {
    const s = this.appData.specs.find(x=>x.id===sid);
    $('specialtyGrid').innerHTML = `<button onclick="App.renderPatientHome()" style="grid-column:1/3; background:none; border:none; text-align:left; color:var(--primary); font-weight:600;">← Retour</button>` + (s.docs||[]).filter(d=>!d.expiresAt||Date.now()<=d.expiresAt).map(d=>`<div class="manage-item flex-between" onclick="App.openDocCal('${sid}','${d.id}')" style="grid-column:1/3; cursor:pointer;"><div><b>Dr. ${d.name}</b><br><small>${d.title}</small></div><i class="fas fa-calendar-alt text-primary"></i></div>`).join('');
  },
  openDocCal(sid, did) { this.selectedDoc = this.appData.specs.find(s=>s.id===sid).docs.find(d=>d.id===did); $('calPatientInfo').innerHTML=`<b>Dr. ${this.selectedDoc.name}</b>`; this.showScreen('pageCalPatient'); },

  updateUI() {
    const act = document.querySelector('.screen.active')?.id;
    if(act==='pagePatients') this.renderPatientHome();
    if(this.activeDoc && act==='pageDocSpace') { this.renderCalendar('docCalContainer',true); this.renderDocApps(); $('docNotifDot').style.display=(this.activeDoc.appointments||[]).some(a=>a.status==='pending')?'inline-block':'none'; }
    if(this.selectedDoc && act==='pageCalPatient') this.renderCalendar('calPatientContainer',false);
    if(this.activePatient && act==='pagePatientSpace') this.renderPatientApps();
    if(act==='pageAdmin') {
      $('notifDot').style.display=this.appData.pendingPatients?.length?'inline-block':'none';
      this.renderAdminsList();
    }
  },

  closeModals() { $$('.internal-modal').forEach(m=>m.classList.remove('modal-show')); },
  toggleSect(h) { h.nextElementSibling.classList.toggle('open'); },
  cycleCap(id) { let v=parseInt($(id).textContent); $(id).textContent = v>=4 ? 1 : v+1; },

  addSpec() { const n = $('admSpecInput').value; if(!n) return; this.appData.specs=[...(this.appData.specs||[]),{id:'s'+Date.now(),label:n,icon:'fa-user-md',docs:[]}]; this.saveData(); $('admSpecInput').value=""; this.showToast("Ajoutée !"); },
  updateSpecSel() { $('admSpecSelect').innerHTML = (this.appData.specs||[]).map(s=>`<option value="${s.id}">${s.label}</option>`).join(''); },
  
  addDoc() {
    const sid=$('admSpecSelect').value, j=parseInt($('admDocDuration').value)||0;
    if(!sid||!$('admDocName').value) return this.showToast("Champs requis");
    const s = this.appData.specs.find(x=>x.id===sid);
    s.docs.push({id:'d'+Date.now(), name:$('admDocName').value, title:$('admDocTitle').value, tel:$('admDocTel').value, code:$('admDocCode').value, capacity:parseInt($('capDisplay').textContent), validityDays:j, expiresAt:Date.now()+(j*86400000)-(j?0:60000), appointments:[], blockedSlots:[], history:[]});
    this.saveData(); this.showToast("Ajouté !"); $$('.admin-content input').forEach(i=>i.value="");
  },

  handleSignup() { const n=$('regName').value, t=$('regTel').value, c=$('regPass').value; if(!n||!t||!c) return; this.appData.pendingPatients=[...(this.appData.pendingPatients||[]),{id:Date.now(),name:n,tel:t,code:c}]; this.saveData(); this.showToast("Demande envoyée !"); this.showScreen('pagePatients'); },
  toggleHourMode() { this.isHourMode = !this.isHourMode; $('btnToggleHours').classList.toggle('bg-danger'); $('btnToggleHours').classList.toggle('bg-accent'); this.showToast(this.isHourMode?"Blocage activé":"Blocage désactivé"); }
};

window.App = App;
App.init();

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
</script>
</body>
</html>
